<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Library Management Engine</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 p-8 font-sans">
  <div class="max-w-5xl mx-auto space-y-6">
    <!-- Header & Time Simulation -->
    <div class="flex justify-between items-center bg-slate-900 p-5 rounded-xl border border-slate-800">
      <div>
        <h1 class="text-2xl font-bold text-indigo-400">Library Asset & Loan Engine</h1>
        <p id="dayDisplay" class="text-sm text-slate-400">Simulated Day: 0</p>
      </div>
      <div class="flex gap-2">
        <button onclick="advanceDay(1)" class="bg-indigo-600 hover:bg-indigo-500 px-4 py-2 rounded-lg text-sm font-medium">+1 Day</button>
        <button onclick="advanceDay(7)" class="bg-slate-800 hover:bg-slate-700 px-4 py-2 rounded-lg text-sm font-medium">+7 Days</button>
      </div>
    </div>

    <div id="alertBox" class="hidden p-3 rounded-lg text-sm font-medium"></div>

    <!-- Actions -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <div class="bg-slate-900 p-4 rounded-xl border border-slate-800 space-y-3">
        <h2 class="font-semibold text-slate-200">Add Item</h2>
        <select id="itemType" class="w-full bg-slate-800 p-2 rounded text-sm">
          <option value="BOOK">Book</option>
          <option value="MAGAZINE">Magazine</option>
          <option value="REFERENCE">Reference Book</option>
        </select>
        <input id="itemId" placeholder="ID (e.g., B1)" class="w-full bg-slate-800 p-2 rounded text-sm" />
        <input id="itemTitle" placeholder="Title" class="w-full bg-slate-800 p-2 rounded text-sm" />
        <input id="itemExtra" placeholder="Author / Issue" class="w-full bg-slate-800 p-2 rounded text-sm" />
        <button onclick="addItem()" class="w-full bg-emerald-600 hover:bg-emerald-500 py-2 rounded text-sm font-medium">Add to Catalog</button>
      </div>

      <div class="bg-slate-900 p-4 rounded-xl border border-slate-800 space-y-3">
        <h2 class="font-semibold text-slate-200">Register Member</h2>
        <select id="memberType" class="w-full bg-slate-800 p-2 rounded text-sm">
          <option value="STUDENT">Student (Max 3, 14d)</option>
          <option value="STAFF">Staff (Max 4, 21d)</option>
          <option value="FACULTY">Faculty (Max 5, 30d)</option>
        </select>
        <input id="memberId" placeholder="Member ID (e.g., S1)" class="w-full bg-slate-800 p-2 rounded text-sm" />
        <input id="memberName" placeholder="Full Name" class="w-full bg-slate-800 p-2 rounded text-sm" />
        <button onclick="addMember()" class="w-full bg-emerald-600 hover:bg-emerald-500 py-2 rounded text-sm font-medium">Register Member</button>
      </div>

      <div class="bg-slate-900 p-4 rounded-xl border border-slate-800 space-y-3">
        <h2 class="font-semibold text-slate-200">Loan Execution</h2>
        <input id="txMemberId" placeholder="Member ID (for Borrow)" class="w-full bg-slate-800 p-2 rounded text-sm" />
        <input id="txItemId" placeholder="Item ID" class="w-full bg-slate-800 p-2 rounded text-sm" />
        <div class="flex gap-2">
          <button onclick="borrowItem()" class="flex-1 bg-indigo-600 hover:bg-indigo-500 py-2 rounded text-sm font-medium">Borrow</button>
          <button onclick="returnItem()" class="flex-1 bg-amber-600 hover:bg-amber-500 py-2 rounded text-sm font-medium">Return</button>
        </div>
      </div>
    </div>

    <!-- Live Inventory -->
    <div class="bg-slate-900 p-5 rounded-xl border border-slate-800">
      <h2 class="font-semibold text-slate-200 mb-3">Live Catalog & Inventory</h2>
      <table class="w-full text-left text-sm">
        <thead class="text-slate-400 border-b border-slate-800">
          <tr>
            <th class="pb-2">ID</th>
            <th class="pb-2">Type</th>
            <th class="pb-2">Status</th>
          </tr>
        </thead>
        <tbody id="inventoryBody" class="divide-y divide-slate-800"></tbody>
      </table>
    </div>
  </div>

  <script>
    function showAlert(msg, isError = false) {
      const box = document.getElementById('alertBox');
      box.textContent = msg;
      box.className = `p-3 rounded-lg text-sm font-medium ${isError ? 'bg-red-950 text-red-300 border border-red-800' : 'bg-emerald-950 text-emerald-300 border border-emerald-800'}`;
    }

    async function apiCall(url, method = 'GET', body = null) {
      const opts = { method, headers: { 'Content-Type': 'application/json' } };
      if (body) opts.body = JSON.stringify(body);
      const res = await fetch(url, opts);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Request failed');
      return data;
    }

    async function refresh() {
      const state = await apiCall('/api/state');
      document.getElementById('dayDisplay').textContent = `Simulated Day: ${state.currentDay}`;
      const tbody = document.getElementById('inventoryBody');
      if (state.inventory === 'NONE') {
        tbody.innerHTML = '<tr><td colspan="3" class="py-3 text-slate-500">No items in catalog yet.</td></tr>';
        return;
      }
      tbody.innerHTML = state.inventory.split('\n').map(line => {
        const [id, type, status] = line.split('|');
        return `<tr>
          <td class="py-2 font-mono text-indigo-300">${id}</td>
          <td class="py-2 text-slate-400">${type}</td>
          <td class="py-2">${status}</td>
        </tr>`;
      }).join('');
    }

    async function addItem() {
      try {
        const res = await apiCall('/api/items', 'POST', {
          type: document.getElementById('itemType').value,
          id: document.getElementById('itemId').value,
          title: document.getElementById('itemTitle').value,
          extra: document.getElementById('itemExtra').value
        });
        showAlert(res.message);
        refresh();
      } catch (e) { showAlert(e.message, true); }
    }

    async function addMember() {
      try {
        const res = await apiCall('/api/members', 'POST', {
          type: document.getElementById('memberType').value,
          id: document.getElementById('memberId').value,
          name: document.getElementById('memberName').value
        });
        showAlert(res.message);
      } catch (e) { showAlert(e.message, true); }
    }

    async function borrowItem() {
      try {
        const res = await apiCall('/api/borrow', 'POST', {
          memberId: document.getElementById('txMemberId').value,
          itemId: document.getElementById('txItemId').value
        });
        showAlert(res.message);
        refresh();
      } catch (e) { showAlert(e.message, true); }
    }

    async function returnItem() {
      try {
        const res = await apiCall('/api/return', 'POST', {
          itemId: document.getElementById('txItemId').value
        });
        showAlert(res.message);
        refresh();
      } catch (e) { showAlert(e.message, true); }
    }

    async function advanceDay(days) {
      try {
        const res = await apiCall('/api/advance', 'POST', { days: String(days) });
        document.getElementById('dayDisplay').textContent = res.message.replace('OK ', '');
        refresh();
      } catch (e) { showAlert(e.message, true); }
    }

    refresh();
  </script>
</body>
</html>
